# Colors and shapes of the "Modern GoMule" appearance, on top of FlatLaf's dark theme.

@background = #1e1f22
@foreground = #dfe1e5
@gold = #d4a84b
@surface = #232428
@selection = #4a3d22
# brighter gold for the selected row in item tables and the project list, still dark enough for the item colors
@brightSelection = #6b5628
# muted gold for keyboard focus, so it shows without shouting
@focus = #8b713b

Component.arc = 8
Button.arc = 8
TextComponent.arc = 6
CheckBox.arc = 4
Component.focusWidth = 1
Component.focusColor = #d4a84b40
Component.focusedBorderColor = @gold
Component.borderColor = #3c3f44

Button.background = #2b2d30
Button.hoverBackground = #34363a
Button.focusedBorderColor = @focus
Button.default.focusedBorderColor = #e6c47a
Button.default.focusColor = #d4a84b40
Button.default.background = @gold
Button.default.foreground = #1e1f22
CheckBox.icon.selectedBackground = @gold
CheckBox.icon.selectedBorderColor = @gold
CheckBox.icon.checkmarkColor = #1e1f22
RadioButton.icon.centerDiameter = 6

ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.showButtons = false
ScrollBar.track = @background
ScrollBar.thumb = #4a4c51

Table.background = @surface
Table.alternateRowColor = #27282c
Table.selectionBackground = @brightSelection
Table.selectionForeground = @foreground
Table.selectionInactiveBackground = @brightSelection
Table.rowHeight = 22
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
TableHeader.background = #2b2d30
TableHeader.separatorColor = #3c3f44
TableHeader.bottomSeparatorColor = @gold

# the project list on the left
Tree.background = #141517
Tree.selectionBackground = @brightSelection
Tree.selectionInactiveBackground = @brightSelection
# stashes and characters that are open
GoMule.projectTree.openForeground = #f2d45c
List.selectionBackground = @selection
List.selectionInactiveBackground = @selection
MenuItem.selectionBackground = @selection
Menu.selectionBackground = @selection

TitledBorder.titleColor = @gold
Desktop.background = #17181a
InternalFrame.activeTitleBackground = #2b2d30
InternalFrame.inactiveTitleBackground = #232428
InternalFrame.activeBorderColor = @gold
InternalFrame.inactiveBorderColor = #8a8d93
InternalFrame.inactiveTitleForeground = #a9acb2
SplitPaneDivider.draggingColor = @gold
ToolTip.background = #111214
ToolTip.foreground = @foreground

# GoMule's own: item tables and the item description pane
GoMule.itemTable.background = @surface
GoMule.itemTable.alternateBackground = #27282c
GoMule.itemTable.selectionBackground = @brightSelection
GoMule.itemText.background = #111214
